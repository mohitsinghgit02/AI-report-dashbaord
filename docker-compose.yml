services:

  backend:
    build: ./backend
    container_name: ai-report-backend
    volumes:
      - ./backend/data:/app/data
    env_file:
      - .env
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ai-report-frontend
    env_file:
      - .env
    environment:
      - REACT_APP_API_URL=/api
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: ai-report-nginx
    ports:
      - "8080:80"   # change here
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
    restart: unless-stopped